services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backup:
    build: ./backup
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY}
      BACKUP_INTERVAL_SECONDS: 86400
    depends_on:
      - postgres
    volumes:
      - postgres_backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "find /backups/daily -name '*.dump.enc' -mtime -2 -type f | grep -q ."]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env
    command: python -m app.api_supervisor
    ports:
      - "127.0.0.1:8188:8000"
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  worker:
    build: ./backend
    env_file: .env
    command: python -m app.worker
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  bot:
    build: ./backend
    env_file: .env
    command: python -m app.bot
    depends_on:
      - api
    restart: unless-stopped

  admin:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  postgres_backups:
