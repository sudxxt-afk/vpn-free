server {
    listen 80;
    listen [::]:80;
    server_name zazavpn.ru www.zazavpn.ru panel.94-249-180-48.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 404;
}
