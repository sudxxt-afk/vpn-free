server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Docker service IPs change when containers are recreated. Resolve the API
    # through Docker's embedded DNS instead of keeping nginx's startup-time IP.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $api_upstream api:8000;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build artifacts are immutable; index.html must always revalidate
    # so a deploy never leaves browsers mixing old HTML with new assets.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
